 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weatherly</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f0f6ff; color: #24324a; }
    h1 { color: #2878d0; }
    .card { background: white; padding: 20px; border-radius: 14px; margin-top: 20px; }
    input, button { padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #2878d0; color: white; cursor: pointer; }
    #result { margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Weatherly ☁️</h1>
  <p>Plan your day with the weather in mind.</p>
  <div class="card">
    <h2>Check a city</h2>
    <input id="city" placeholder="Enter a city, e.g. Istanbul">
    <button onclick="getWeather()">Check weather</button>
    <div id="result">Enter a city to check its forecast.</div>
  </div>
  <script>
    async function getWeather() {
      const city = document.getElementById('city').value.trim();
      const result = document.getElementById('result');
      if (!city) {
        result.textContent = 'Please enter a city.';
        return;
      }
      result.textContent = 'Checking forecast...';
      try {
        const response = await fetch('/api/weather?city=' + encodeURIComponent(city));
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Could not load weather.');
        result.textContent = `${data.city}: ${data.temperature}°C, ${data.condition}`;
      } catch (error) {
        result.textContent = 'Forecast is not connected yet. We will connect it to the server next.';
      }
    }
  </script>
</body>
</html>
